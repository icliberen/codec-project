[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-wavelet-codec"
version = "0.1.0"
description = "Educational JPEG/JPEG2000-inspired image compression codec"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0",
  "PyWavelets>=1.6",
  "matplotlib>=3.8",
  "PySide6>=6.8",
]

[project.optional-dependencies]
video = ["opencv-python>=4.10"]

[project.scripts]
smartcodec = "smartcodec.cli:main"

[tool.setuptools.packages.find]
include = ["smartcodec*"]
