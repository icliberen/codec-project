name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'scripts/collect_licenses.py', 'build_windows.ps1', 'requirements-build.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Read version and protect existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists; update pyproject.toml first." }
          $global:LASTEXITCODE = 0
      - name: Install fixed build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Compile and run source smoke checks
        run: |
          python -m compileall -q smartcodec scripts start_gui.pyw
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          python scripts/verify_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Source smoke checks failed' }
      - name: Build and validate the Windows application
        run: ./build_windows.ps1 -PythonExe python -SkipInstall
      - name: Assemble redistributable ZIP and checksums
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath README.md -Destination 'dist/Smart Codec'
          $fonts = @(Get-ChildItem -LiteralPath 'dist/Smart Codec' -Recurse -File | Where-Object Name -Match '^(segoe.*|arial.*)\.(ttf|otf)$')
          if ($fonts.Count -gt 0) { throw 'Windows fonts must not be redistributed' }
          Compress-Archive -LiteralPath 'dist/Smart Codec' -DestinationPath release/Smart-Codec-Windows-x64.zip
          $hash = (Get-FileHash -LiteralPath release/Smart-Codec-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Smart-Codec-Windows-x64.zip" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
          Copy-Item -LiteralPath 'third_party_licenses/components.json' -Destination release/components.json
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Smart Codec Windows x64 - $env:RELEASE_TAG

          Extract the complete ZIP, then run Smart Codec/Smart Codec.exe.
          Keep the _internal folder next to the EXE. Python installation is not required.

          Includes JPEG/JPEG2000, DCT/DWT, comparison views, DCT/DWT PSNR-BPP graph,
          English/Turkish UI, White/Blue/Dark themes, optional AI and video tools.
          Source compilation, codec/Qt smoke checks, and packaged startup were checked by this build.

          Unsigned educational application. AGPL-3.0-only; third-party notices are included.
          YOLO models are included under Ultralytics' terms. Windows fonts and test photos are not bundled.
          Source commit: $env:GITHUB_SHA
          "@
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Smart Codec $env:RELEASE_TAG" --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh release upload $env:RELEASE_TAG release/Smart-Codec-Windows-x64.zip release/SHA256SUMS.txt release/components.json --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains draft' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
